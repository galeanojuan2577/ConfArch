# Set your personal hyprland configuration here
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/userprefs.t2

# █░█ █▀  █▀▀ █▀█    █▀█ █▀█ █▀▀ █▀▀ █▀
# █▄█ ▄█  ██▄ █▀▄    █▀▀ █▀▄ ██▄ █▀░ ▄█
# Teclado en español latinoamericano (sobrevive a los restores de HyDE)
input {
    kb_layout = latam
    follow_mouse = 1
}

# Gestos globales de touchpad (libinput-gestures) — HyDE lo trae comentado en hyprland.conf,
# que es Sync y se sobrescribe en cada restore; aquí queda permanente.
exec-once = libinput-gestures

